zones:
  zone1:
    master: doorce-vm3
    members:
      doorce-vm3:
        address: 172.16.16.1
        user: ubuntu
    networks:
      incus-udas:
        address: 10.8.1.1/24
        type: bridge
        description: "Internal network with ACL"

doorce:
  external_url: https://dev3.pw.pl.doorce.net

ip_white_list:
  - 172.16.16.0/28 #internal network
  - your.ip
