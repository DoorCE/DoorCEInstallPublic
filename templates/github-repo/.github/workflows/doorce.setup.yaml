name: DoorCE setup
run-name: >-
  ${{ 
    format('{0}: {1} by @{2}', 
      (github.event.inputs.action || 'plan'), 
      (github.event.inputs.reason || github.ref_name), 
      github.actor
    ) 
  }}

on:
  # push:
  #  branches:
  #    - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply, destroy]
      reason:
        description: 'SAFETY CHECK: Type confirmation for destroy -> "Yes, I am 100% sure I want to destroy this service and I understand the consequences"'
        required: false
        default: "Manual triggered workflow"

jobs:
  call-reusable-workflow:
    uses: DoorCE/DoorCEInstallPublic/.github/workflows/doorce.setup.yaml@v1.1.14
    with:
      action: ${{ github.event.inputs.action || 'plan' }}
      reason: ${{ github.event.inputs.reason || format('Push to {0}', github.ref_name) }}
      branch: v1.1.14
    #secrets: inherit
    secrets:
      TRAEFIK_KEY: ${{ secrets.TRAEFIK_KEY }}
      TRAEFIK_CERT: ${{ secrets.TRAEFIK_CERT }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
