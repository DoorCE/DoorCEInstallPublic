name: Host setup
run-name: >-
  ${{ 
    format('{0}: {1} by @{2}', 
      (github.event.inputs.action || 'plan'), 
      (github.event.inputs.reason || github.ref_name), 
      github.actor
    ) 
  }}

on:
  # push:
  #  branches:
  #    - main
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply]
      reason:
        description: 'Reason for this action (optional)'
        required: false
        default: "Manual triggered workflow"

jobs:
  call-reusable-workflow:
    uses: DoorCE/DoorCEInstall-workflows/.github/workflows/host.setup.yaml@v1.1.10
    with:
      action: ${{ github.event.inputs.action || 'plan' }}
      reason: ${{ github.event.inputs.reason || format('Push to {0}', github.ref_name) }}
      branch: v1.1.10
    #secrets: inherit
