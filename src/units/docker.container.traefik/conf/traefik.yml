global:
  sendAnonymousUsage: false
  checkNewVersion: false
log:
  level: DEBUG
api:
  dashboard: true
  insecure: false
  basePath: "${service_site_path}"
ping: {}
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: "websecure"
          scheme: "https"
          permanent: true
  websecure:
    address: ":443"
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: ${network}
  file:
    filename: "/etc/traefik/traefik.dynamic.conf.yml"
    watch: true
metrics:
  prometheus: {}
accessLog: {}
